name: build wallet APK
# Manual trigger only (APK builds consume CI minutes). Actions tab -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore twa/android.keystore \
            -alias larzwallet -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass larzwallet -keypass larzwallet \
            -dname "CN=Larz Wallet, O=Larz OS, C=US"

      - name: Print SHA-256 fingerprint (for assetlinks.json)
        run: |
          echo "::group::assetlinks fingerprint"
          keytool -list -v -keystore twa/android.keystore -alias larzwallet \
            -storepass larzwallet | grep "SHA256:" || true
          echo "::endgroup::"

      - name: Build APK
        working-directory: twa
        run: |
          bubblewrap build --skipPwaValidation \
            --manifest ./twa-manifest.json <<< $'larzwallet\nlarzwallet\n' || \
          bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: larzwallet
          BUBBLEWRAP_KEY_PASSWORD: larzwallet

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LarzWallet-apk
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
          if-no-files-found: warn

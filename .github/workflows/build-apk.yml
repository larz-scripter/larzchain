name: build wallet APK
# Manual trigger (APK builds use CI minutes). Actions tab -> Run workflow.
# The TWA Android project is committed under twa/ (generated by Bubblewrap);
# CI just creates a signing keystore and compiles + signs it.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (CI JDK + Android SDK, no prompts)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Generate signing keystore
        working-directory: twa
        run: |
          keytool -genkeypair -v -keystore android.keystore \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass larzwallet -keypass larzwallet \
            -dname "CN=Larz Wallet, O=Larz OS, C=US"

      - name: SHA-256 fingerprint (for assetlinks.json)
        working-directory: twa
        run: |
          keytool -list -v -keystore android.keystore -alias android \
            -storepass larzwallet | grep "SHA256:" | sed 's/.*SHA256: //' | tee fingerprint.txt

      - name: Build & sign APK
        working-directory: twa
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: larzwallet
          BUBBLEWRAP_KEY_PASSWORD: larzwallet

      - name: Upload APK + fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: LarzWallet
          path: |
            twa/app-release-signed.apk
            twa/app-release-unsigned-aligned.apk
            twa/*.apk
            twa/fingerprint.txt
          if-no-files-found: warn

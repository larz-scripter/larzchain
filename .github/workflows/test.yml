name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: consensus tests (deterministic, zero-dep)
        run: python tests/test_chain.py
  # test_p2p.py (real-socket P2P) + test_airdrop.py (needs the larz framework)
  # are run locally as integration tests; sockets are too timing-flaky for CI.

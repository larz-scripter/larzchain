name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install larz (explorer/airdrop deps)
        run: pip install git+https://github.com/larz-scripter/larz
      - name: consensus + p2p tests (no framework needed)
        run: |
          python tests/test_chain.py
          python tests/test_p2p.py

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "larzchain"
version = "0.2.1"
description = "LarzCoin (LARZ) — a fair-launch, proof-of-work cryptocurrency. Pure Python, zero dependencies. Earned, never sold."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["blockchain", "cryptocurrency", "bitcoin", "proof-of-work", "secp256k1", "utxo", "fair-launch", "zero-dependency"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
# `larzpay.py` bridges LARZ into the Larz web framework's money layer.
larzpay = ["larz"]
# `larzscript_settlement.py` lets the money-native Larzscript language settle
# its `pay`/`subscribe` on-chain. Core larzchain needs neither.
larzscript = ["larzscript"]

[project.scripts]
larzchain = "larzchain.cli:main"

[project.urls]
Homepage = "https://larzos.com/larzchain/"
Repository = "https://github.com/larz-scripter/larzchain"
Documentation = "https://larzos.com/larzchain/run-a-node/"

[tool.setuptools.packages.find]
include = ["larzchain*"]
